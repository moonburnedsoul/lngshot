<<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LNGSHOT: S.W.I.S.H - Twibbon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <div class="brand">
      <img src="banner.png" alt="LNGSHOT" class="brand-img">
    </div>
  </header>

  <main class="layout">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="canvas"></canvas>
      </div>
    </div>

    <div class="panel">

      <section class="step">
        <h2><span>1</span> Pilih Foto</h2>
        <input type="file" id="photoInput" accept="image/*" hidden>
        <button class="btn primary" id="pickPhoto">Upload Foto Kamu</button>
      </section>

      <section class="step">
        <h2><span>2</span> Sesuaikan Posisi</h2>

        <div class="range">
          <span>Zoom</span>
          <input type="range" id="zoom" min="0.1" max="5" step="0.01" value="1" disabled>
          <output id="zoomOut">100%</output>
        </div>
        <div class="row">
          <button class="btn small" id="zoomOutBtn" disabled>-</button>
          <button class="btn small wide" id="resetBtn" disabled>Reset Posisi</button>
          <button class="btn small" id="zoomInBtn" disabled>+</button>
        </div>

        <div class="range" style="margin-top: 12px;">
          <span>Rotasi</span>
          <input type="range" id="rotate" min="-180" max="180" step="1" value="0" disabled>
          <output id="rotateOut">0°</output>
        </div>

        <div class="position-control" style="margin-top: 14px;">
          <span class="control-label">Geser Posisi Twibbon</span>
          <div class="dpad">
            <button class="btn small dpad-btn" id="moveUp" disabled>▲</button>
            <div class="dpad-row">
              <button class="btn small dpad-btn" id="moveLeft" disabled>◄</button>
              <button class="btn small dpad-btn" id="moveRight" disabled>►</button>
            </div>
            <button class="btn small dpad-btn" id="moveDown" disabled>▼</button>
          </div>
        </div>
      </section>

      <section class="step">
        <h2><span>3</span> Unduh Hasil Twibbon</h2>
        <button class="btn primary" id="download" disabled>Download Twibbon</button>
      </section>
    </div>
  </main>

  <script src="app.js"></script>

  <footer class="footer">
    <p>Made by <span>@MournedHost</span></p>
  </footer>

</body>
</html>
